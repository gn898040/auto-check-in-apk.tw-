name: APK.TW Auto Check-in

on:
  schedule:
    # 每天台灣時間上午 08:00 自動執行 (UTC 00:00)
    - cron: '0 19  * * *'
  workflow_dispatch: # 支援在 Actions 頁面手動點擊按鈕測試

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 i18n

      - name: Generate Dummy config.json
        run: |
          cat <<'EOF' > config.json
          {
            "lang": "zh_TW",
            "apktw": {
              "username": "dummy_user",
              "password": "dummy_password"
            }
          }
          EOF
          echo "config.json 建立完成！"

      - name: Inject Session Cookie
        env:
          APKTW_COOKIE: ${{ secrets.APKTW_COOKIE }}
        run: |
          python -c '
          import os, pickle, requests
          cookie_str = os.environ.get("APKTW_COOKIE", "")
          session = requests.Session()
          if cookie_str:
              for item in cookie_str.split(";"):
                  if "=" in item:
                      k, v = item.strip().split("=", 1)
                      session.cookies.set(k, v, domain="apk.tw")
              with open(".session_cookies.pkl", "wb") as f:
                  pickle.dump(session.cookies, f)
              print("Session Cookie 注入完成！")
          '

      - name: Run Check-in Script
        run: |
          python main.py --type apktw
