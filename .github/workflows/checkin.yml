name: APK.TW Auto Check-in

on:
  schedule:
    # 每天台灣時間上午 08:00 自動執行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 Actions 頁面手動點擊按鈕測試

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4 i18n

      - name: Inject Session Cookie
        env:
          APKTW_COOKIE: ${{ secrets.APKTW_COOKIE }}
        run: |
          python -c '
          import os, pickle, requests
          cookie_str = os.environ.get("APKTW_COOKIE", "")
          session = requests.Session()
          if cookie_str:
              for item in cookie_str.split(";"):
                  if "=" in item:
                      k, v = item.strip().split("=", 1)
                      session.cookies.set(k, v, domain="apk.tw")
              with open(".session_cookies.pkl", "wb") as f:
                  pickle.dump(session.cookies, f)
              print("Session Cookie 注入成功！")
          '

      - name: Run Check-in Script
        run: |
          if [ -f main.py ]; then
            python main.py
          elif [ -f auto_check_in.py ]; then
            python auto_check_in.py
          elif [ -f cli.py ]; then
            python cli.py
          else
            python *.py
          fi
