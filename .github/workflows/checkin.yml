name: APK.TW Auto Check-in

on:
  schedule:
    # 每天台灣時間上午 8:00 自動執行 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動按鈕點擊觸發

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: Run Check-in Script
        env:
          APKTW_USERNAME: ${{ secrets.APKTW_USERNAME }}
          APKTW_PASSWORD: ${{ secrets.APKTW_PASSWORD }}
          APKTW_COOKIE: ${{ secrets.APKTW_COOKIE }}
        run: |
          # 尋找專案中的 python 腳本執行 (若腳本檔名不同請自行修改)
          if [ -f main.py ]; then
            python main.py
          elif [ -f auto_check_in.py ]; then
            python auto_check_in.py
          elif [ -f index.py ]; then
            python index.py
          else
            python *.py
          fi
